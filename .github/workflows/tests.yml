name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by qa-commerce-lab on every push to its main branch (.github/workflows/trigger-tests.yml there).
  repository_dispatch:
    types: [lab-updated]
  schedule:
    # Nightly run catches changes in qa-commerce-lab even when this repository does not change.
    - cron: '17 3 * * *'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Playwright against the lab (Docker + Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tests
        uses: actions/checkout@v7

      # Which lab version to test:
      # 1. a run triggered by the lab tests the exact lab commit that was pushed;
      # 2. a branch or pull request tests the lab branch with the same name, if it exists,
      #    so new tests and the lab changes they need can be developed together;
      # 3. everything else tests the lab's main branch.
      - name: Choose the lab version to test
        id: lab
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$DISPATCH_SHA" ]; then
            ref="$DISPATCH_SHA"
          elif [ "$BRANCH" != "main" ] && git ls-remote --exit-code --heads https://github.com/TomasevicJovan/qa-commerce-lab.git "$BRANCH" > /dev/null; then
            ref="$BRANCH"
          else
            ref="main"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing qa-commerce-lab at: $ref"

      - name: Check out qa-commerce-lab
        uses: actions/checkout@v7
        with:
          repository: TomasevicJovan/qa-commerce-lab
          path: lab
          ref: ${{ steps.lab.outputs.ref }}

      - name: Show the lab commit under test
        working-directory: lab
        run: |
          git log -1 --format='Lab commit under test: %H %s'

      - name: Start the lab with fresh data
        working-directory: lab
        run: docker compose up --build -d --wait --wait-timeout 240

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Lab logs
        if: failure()
        working-directory: lab
        run: docker compose logs --no-color --tail 200

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Prepare report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  publish-report:
    name: Publish report to GitHub Pages
    needs: test
    # Publish failing runs too: a red report is the one people need to read.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
