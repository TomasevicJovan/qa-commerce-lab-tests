name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by qa-commerce-lab on every push to its main branch (.github/workflows/trigger-tests.yml there).
  repository_dispatch:
    types: [lab-updated]
  schedule:
    # Nightly run catches changes in qa-commerce-lab even when this repository does not change.
    - cron: '17 3 * * *'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Playwright against the lab (Docker + Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tests
        uses: actions/checkout@v7

      - name: Check out qa-commerce-lab
        uses: actions/checkout@v7
        with:
          repository: TomasevicJovan/qa-commerce-lab
          path: lab
          # A lab-triggered run tests the exact lab commit that was pushed; other runs use the lab's latest main.
          ref: ${{ github.event.client_payload.sha || '' }}

      - name: Show the lab commit under test
        working-directory: lab
        run: |
          git log -1 --format='Lab commit under test: %H %s'

      - name: Start the lab with fresh data
        working-directory: lab
        run: docker compose up --build -d --wait --wait-timeout 240

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Lab logs
        if: failure()
        working-directory: lab
        run: docker compose logs --no-color --tail 200

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Prepare report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  publish-report:
    name: Publish report to GitHub Pages
    needs: test
    # Publish failing runs too: a red report is the one people need to read.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
